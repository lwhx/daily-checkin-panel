
name = "daily-checkin-panel"
main = "src/index.js"

compatibility_date = "2026-09-30"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "daily-checkin-panel"
database_id = "de60a3da-229a-453e-8e35-951be327d834"
